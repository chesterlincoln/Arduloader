name: build-packages

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. windows-latest, ubuntu-latest, macos-latest, ubuntu-22.04-arm)"
        required: true
        default: "windows-latest"
      python-version:
        description: "Python version for the build"
        required: true
        default: "3.13"

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install py2exe PyQt6

      - name: Install deps (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python buildexe.py

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: pyinstaller --onefile --windowed --name arduloader main.py

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: arduloader-${{ inputs.runner }}
          path: dist/arduloader.exe

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: arduloader-${{ inputs.runner }}
          path: dist/arduloader.app

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: arduloader-${{ inputs.runner }}
          path: dist/arduloader
